[project]
name = "yunzhun-mail-gateway"
version = "0.1.0"
description = "Mail gateway infra: bridges 163/NetEase IMAP/POP3/SMTP upstream, exposes a REST API downstream"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "email-validator>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pdm]
package-type = "application"
